<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>لوحة الإدارة</title>

    <link rel="preconnect"
          href="https://fonts.googleapis.com">

    <link rel="preconnect"
          href="https://fonts.gstatic.com"
          crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;800&display=swap"
          rel="stylesheet">

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

    <link rel="stylesheet"
          href="css/variables.css">

    <link rel="stylesheet"
          href="css/theme.css">

    <link rel="stylesheet"
          href="css/animations.css">

    <link rel="stylesheet"
          href="css/admin.css">

</head>

<body>

<div class="dashboard">

    <!-- Header -->

    <header class="header">

        <div class="header-right">

            <img src="assets/logo.png"
                 class="logo"
                 alt="Logo">

            <div>

                <h2>

                    نظام التقارير الأسبوعية

                </h2>

                <span>

                    لوحة الإدارة

                </span>

            </div>

        </div>

        <div class="header-left">

            <div id="currentTime">

                00:00

            </div>

            <div id="currentDate">

                00/00/0000

            </div>

            <button id="themeBtn">

                <i class="fa-solid fa-moon"></i>

            </button>

            <button id="logoutBtn">

                <i class="fa-solid fa-right-from-bracket"></i>

            </button>

        </div>

    </header>

    <!-- Menu -->

    <section class="menu">

        <button
            class="menu-card active"
            data-page="employees">

            <i class="fa-solid fa-users"></i>

            <span>

                الموظفون

            </span>

        </button>

        <button
            class="menu-card"
            data-page="reports">

            <i class="fa-solid fa-file-pdf"></i>

            <span>

                التقارير

            </span>

        </button>

        <button
            class="menu-card"
            data-page="settings">

            <i class="fa-solid fa-gear"></i>

            <span>

                الإعدادات

            </span>

        </button>

    </section>

    <!-- Content -->

    <main
        id="content">

    </main>

</div>

<script src="js/config.js"></script>

<script src="js/storage.js"></script>

<script src="js/admin.js"></script>

</body>

</html>
